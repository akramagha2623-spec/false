.check{

    width:75px;

    color:white;
    border-radius:50%;
    font-size:45px;
    margin:auto;

}


h1{

    color:var(--green);
    font-size:25px;
    margin:20px 0 15px;

}


.text{

    color:#555;
    font-size:16px;

}


.progress{

    height:8px;
    width:100%;
    background:#ddd;
    border-radius:20px;
    margin-top:30px;
    overflow:hidden;

}


.bar{

    height:100%;
    width:0%;
    background:var(--green);
    animation:load 2s forwards;

}


@keyframes load{

    from{
        width:0%;
    }

    to{
        width:100%;
    }

}



.info{

    margin-top:25px;
    color:#555;

}


.brand{

    margin-top:25px;
    color:var(--green);

}



@media(max-width:480px){

.card{

    padding:30px 18px;

}

    font-size:21px;

}


.text{

    font-size:14px;

}


.logo{

    width:110px;
